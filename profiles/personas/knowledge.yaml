description: Personal knowledge work - Obsidian vaults, note capture, long-form writing.
extends: [base]

plugins:
  # Obsidian Markdown (wikilinks, callouts, properties), Bases, JSON Canvas, Obsidian CLI,
  # knap, and defuddle (clean article text from web pages for capture into the vault).
  - obsidian:@obsidian

skills:
  - anthropic-skills:skills/doc-coauthoring    # structured drafting of essays, specs, decision docs
  # promo: narrated explainer videos rendered from a generated JS animation to MP4.
  - ref: explainers:.agents/skills/promo
    requires:
      commands: [node, ffmpeg]
      env: [OPENROUTER_API_KEY]
      note: >-
        Get an OpenRouter key (https://openrouter.ai/keys; about $0.50-1.50 per video) and
        export OPENROUTER_API_KEY or put it in the project's .env. Or ask the agent to set up
        local TTS instead. The agent may install more rendering tools per video.

# Considered and left out (see docs/PERSONAS.md):
#  - pi-skills:youtube-transcript  needs `npm install` inside the skill folder, which agentfiles
#                                  keeps read-only and hash-checked; revisit once ROADMAP R4
#                                  (skill setup steps) lands.
