description: Hands-on engineer shipping code with beau-mode - playbooks, principles, verification, review, frontend.
extends: [base]

# beau-mode is the way of working here: every non-trivial task goes through a playbook,
# named principles, and proof on the real artifact. `mode` makes agentfiles write an
# always-on instruction into each tool telling the agent to use it.
mode: beau-mode

plugins:
  # bstack: beau-mode + 13 playbooks; how, why, teach, recall; verify-work,
  # create-/maintain-verification-skill, swarm; architect, arena, technical-writing;
  # interrogate, show-me-your-work, figure-it-out, reflect, correct, unslop; and the
  # beau-agent subagent (Claude Code, Cursor).
  - mine:@bstack
  # The 24 named principles beau-mode cites ("prove it works", "subtract before you add", ...).
  - mine:@principles

  # Claude Code-only extras (commands and subagents; no portable skills):
  - anthropic-claude-code:plugins/pr-review-toolkit   # specialized review agents (tests, types, errors, comments)
  - anthropic-claude-code:plugins/feature-dev         # /feature-dev: explore -> architect -> implement -> review

  # Security review in three layers: regex warnings on edits, an LLM review of the diff
  # when Claude finishes a turn, and an agentic review on `git commit`. Implemented as
  # Claude Code hooks (Python). Trade-offs: the turn-end and commit reviews make extra
  # model calls (cost + latency), and the SessionStart hook installs the Agent SDK on
  # first run. Remove this entry if that is not worth it for you.
  - ref: anthropic-claude-code:plugins/security-guidance
    allow: [hooks]

# Which model each subagent role uses, per tool (written to ~/.agents/roles.yaml).
# Review panels get their value from model diversity, so `reviewers` lists two families
# where the tool has them. Leave a tool out to use whatever model the session runs on.
# Machine-specific overrides go in local.yaml under the same `roles:` key.
roles:
  code:      {claude-code: sonnet, cursor: grok-4.7-xhigh-fast}
  judgment:  {claude-code: opus,   cursor: claude-opus-5-5-xhigh}
  explorer:  {claude-code: sonnet, cursor: grok-4.7-xhigh-fast}
  reviewers: {claude-code: [opus, sonnet], cursor: [claude-opus-5-5-xhigh, grok-4.7-xhigh-fast]}

skills:
  - anthropic-skills:skills/webapp-testing     # drive a local web app with Playwright to verify UI changes
  - anthropic-skills:skills/mcp-builder        # build MCP servers well
  - anthropic-skills:skills/frontend-design    # distinctive, non-generic UI
  - vercel:skills/react-best-practices         # React / Next.js performance rules
  - vercel:skills/composition-patterns         # React component composition
  - vercel:skills/web-design-guidelines        # UI/UX/accessibility review checklist
  - gdp-ts:skills/gdp-ts                       # authorization checks as compile-time proofs (TypeScript)
  # promo: narrated explainer videos rendered from a generated JS animation to MP4.
  - ref: explainers:.agents/skills/promo
    requires:
      commands: [node, ffmpeg]
      env: [OPENROUTER_API_KEY]
      note: >-
        Get an OpenRouter key (https://openrouter.ai/keys; about $0.50-1.50 per video) and
        export OPENROUTER_API_KEY or put it in the project's .env. Or ask the agent to set up
        local TTS instead. The agent may install more rendering tools per video.
