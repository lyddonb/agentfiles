description: The CFO on demand - ask what you are spending or what a run will cost. Add it to any persona; beau includes it.
extends: [base]

# Three skills from agent-kit's `cfo` plugin, installed one by one so the weekly routine
# (`cfo-brief`) stays out: that one runs from a scheduled task and the Mac's launchd job, which
# read agent-kit directly and need nothing installed. `spend-snapshot` answers "what am I
# spending" and `estimate-run` answers "what will this cost"; both take their numbers from
# `books.py`, which lives in `cfo-books`, so that skill comes along.
#   agentfiles sync builder cfo
# `targets` is spelled out on each skill because a machine can point the `mine` source away from
# Claude Code (agent-kit's plugins then come from its own marketplace there). These three come
# from no marketplace, so without it Claude Code would get none of them.
skills:
  - ref: mine:plugins/cfo/skills/spend-snapshot
    targets: [claude-code, codex, cursor, opencode, pi]
    requires:
      commands: [uv]
      note: >-
        Reads your private cost books. Set CFO_BOOKS to the books checkout in your shell
        profile, or the skill asks where they are.
  - ref: mine:plugins/cfo/skills/estimate-run
    targets: [claude-code, codex, cursor, opencode, pi]
  - ref: mine:plugins/cfo/skills/cfo-books
    targets: [claude-code, codex, cursor, opencode, pi]
