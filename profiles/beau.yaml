description: Beau's everyday machine - all three personas together, plus explainer videos and the CFO on demand.
extends: [builder, eng-lead, knowledge, video, cfo]

# Per-machine choice: set `default_profiles: [beau]` in local.yaml on your laptop so
# a bare `agentfiles sync` installs this. Keep work-only items in a separate private repo.

# Who you are in ledger entries (agent-ledger spec S2).
policy:
  identity: {human: lyddonb@github}

# `ledger`, pinned to the commit of agent-ledger in agentfiles.lock and run with `python3 -I`.
commands:
  ledger: agent-ledger:ci/run_ledger.py

plugins:
  # Replaces Claude Code's compaction summary with Jev decisions: stale tool calls/results are
  # dropped, everything kept stays verbatim. Claude Code only (a function-hook module, no skills).
  # Sends the session transcript to TypeSafe on each compaction, so keep it off machines
  # where that isn't OK.
  # Review: https://github.com/tamaratran/fast-jev-compaction/tree/main/hooks
  - ref: fast-jev-compaction:@fast-jev-compaction
    allow: [hooks]
    requires:
      env: [CLAUDE_CODE_ENABLE_FUNCTION_HOOKS, TYPESAFE_API_KEY]
      note: >-
        Add `export CLAUDE_CODE_ENABLE_FUNCTION_HOOKS=1` and `export TYPESAFE_API_KEY=...` to
        your shell profile, then restart Claude Code. (The key can instead go in the plugin's
        apiKey option via /plugin, but the hooks flag must be an env var.)

# Beau's knowledge base (curator P4-18): pkb's MCP server, read-only, on the index and the config
# file that curator renders. So an agent gets the scope, the freshness labels and the four search
# and read tools that `curator ask` uses, and each search is logged for curator to import and
# grade. `sh -c` because the paths are this machine's: they come from $HOME, since agentfiles
# passes `command`, `args` and `env` through as written. No API key is passed, so an agent's
# search can't spend money; a query pkb routes to tree search (one that names a file path) fails
# as a tool error instead.
# Needs: node 22+, pkb built at ~/code/pkb (`pnpm build`), and `curator kb index` run once.
mcp:
  kb:
    type: stdio
    command: sh
    args:
      - -c
      - >-
        PKB_CONFIG_PATH="$HOME/.local/share/curator/pkb/config.yaml"
        exec node "$HOME/code/pkb/packages/mcp-server/dist/index.js"

instructions:
  - >-
    Beau's knowledge base is the `kb` MCP server (his saved articles, papers and notes). Before
    designing something or answering a question about AI engineering, agents, evals or
    engineering leadership, search it with `search_knowledge`, and say which notes you used with
    their dates.
  # The page names are the labels marked `topic_page: true` in curator's config/interests.yaml.
  # Keep this list in step with them: an agent can't list the pages, and guessed a name that
  # didn't exist the first time (2026-11-14).
  - >-
    A topic's current state is on its topic page. Topic pages are not in the search index, so
    `search_knowledge` never returns one, and limiting a search to `Knowledge/Topics` returns
    nothing: read a page with `get_note` on its exact path. The pages are
    `Knowledge/Topics/<name>.md`, where <name> is one of: AI agents & agent architecture;
    Harness engineering; Evals & LLM-as-judge; Agent memory & context engineering; Coding agents
    & AI-assisted development; Engineering leadership & management; Org & team design; Product
    development process; SaaS business & strategy. If `get_note` says a page isn't there, it
    hasn't been built yet: search the notes. A note marked older is past its half-life, so weigh
    it less.
