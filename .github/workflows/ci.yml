name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * 1"   # Mondays: report upstream updates waiting for review

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # The recorder runs the suite as `python -m unittest discover -s tests` would and also writes
      # per-test time and outcome for the quality books (lyddonb/quality). Pinned so a change to it
      # reaches this repo only through a PR here.
      - uses: actions/checkout@v4
        with:
          repository: lyddonb/agent-kit
          ref: 2899067e8250775f570753f62892c73f8c32f2cc  # agent-kit main after #37 (qualitydirector 0.1.0)
          path: .agent-kit
          sparse-checkout: plugins/bstack/skills/qualitydirector/scripts
      - name: Unit tests (offline), recorded
        run: python3 .agent-kit/plugins/bstack/skills/qualitydirector/scripts/quality.py record tests --out "$RUNNER_TEMP/test-results.jsonl" --repo agentfiles
      - name: Upload the test record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-agentfiles
          path: ${{ runner.temp }}/test-results.jsonl
          if-no-files-found: error
      - name: Config parses
        run: bin/agentfiles doctor || true   # tools are absent in CI; config errors still print
      - name: Lock covers every profile and hashes match upstream
        run: bin/agentfiles lock --frozen
      - name: CLI role agents match the locked agent-kit's second_opinion.py
        run: AGENTFILES_REQUIRE_AGENT_KIT=1 python3 -m unittest tests.test_roles.CliAgentsMatchAgentKitTest

  upstream-updates:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Show pending upstream changes (does not modify the lock)
        run: bin/agentfiles update < /dev/null
